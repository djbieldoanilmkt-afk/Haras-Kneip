<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Haras Kneip - Sistema de gestão de plantel Mangalarga Marchador. Controle de genealogia, reprodução, marcha e relatórios.">
  <meta name="theme-color" content="#f5f2ed">
  <title>Haras Kneip | Mangalarga Marchador</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  
  <!-- CSS -->
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/animations.css">
  
  <style>
    /* Accessibility Classes */
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border-width: 0;
    }
    .focus\:not-sr-only:focus {
      position: static;
      width: auto;
      height: auto;
      padding: 8px 16px;
      margin: 0;
      overflow: visible;
      clip: auto;
      white-space: normal;
      background: var(--accent-gold);
      color: #000;
      z-index: 10000;
      display: block;
      text-align: center;
      font-weight: bold;
    }
  </style>

  <!-- CDNs -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <a href="#main-content" class="sr-only focus:not-sr-only">Pular para conteudo</a>
  
  <!-- Splash Screen with Video Support -->
  <div id="splash-screen" style="position: fixed; inset: 0; background: var(--bg-primary); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 9999; overflow: hidden;">
    
    <!-- Background Video (Coloque o seu arquivo de vídeo em assets/splash-bg.mp4) -->
    <video autoplay muted loop playsinline id="splash-video" style="position: absolute; width: 100%; height: 100%; object-fit: cover; opacity: 0.25; filter: contrast(1.05); pointer-events: none;">
      <source src="assets/splash-bg.mp4" type="video/mp4">
    </video>

    <!-- Overlay Content -->
    <div style="position: relative; z-index: 2; text-align: center;">
      <div class="splash-emoji" style="font-size: 4rem; margin-bottom: 0.5rem;">🐴</div>
      <h1 class="splash-title" style="font-family: 'Playfair Display', serif; color: var(--accent-gold); font-size: 2.2rem; letter-spacing: 2px;">HARAS KNEIP</h1>
      <p class="splash-subtitle" style="color: var(--text-secondary); font-size: 1rem; margin-top: 0.4rem; font-weight: 500;">Mangalarga Marchador</p>
    </div>
  </div>

  <!-- App Shell -->
  <div id="app" class="app-container"></div>
  
  <!-- Toast Container -->
  <div id="toast-container" aria-live="polite" style="position: fixed; bottom: 20px; right: 20px; z-index: 9999; display: flex; flex-direction: column; gap: 10px;"></div>

  <!-- Main App Script -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
